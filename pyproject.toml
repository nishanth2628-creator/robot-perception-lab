[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-perception-lab"
version = "0.1.0"
description = "An explainable synthetic robot-camera segmentation experiment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<13"]
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["perception_lab*"]
